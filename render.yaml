databases:
  - name: rental_system_db
    databaseName: rental_system
    user: rental_system_user

services:
  - type: web
    name: rental-system
    runtime: python3
    buildCommand: "./build.sh"
    startCommand: "gunicorn rental_system_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rental_system_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4